# ITCare website CI/CD
#
# - PRs: build check only (fast feedback, nothing is deployed)
# - push to main: build + publish the built site to the 'deploy' branch.
#   Plesk (beta.itcare.com.mx) pulls the 'deploy' branch via its Git extension,
#   so the server only ever serves built files, never source code.
#
# No FTP or server secrets are needed: publishing uses the built-in GITHUB_TOKEN.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Publish built site to deploy branch
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Include .htaccess in the published tree
        working-directory: ${{ github.workspace }}
        # public/.htaccess is excluded from dist by Vite; copy it in so the
        # published branch is self-contained.
        run: cp public/.htaccess dist/.htaccess

      - name: Push dist/ to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"