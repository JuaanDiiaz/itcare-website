# ITCare website CI/CD
#
# - PRs: build check only (fast feedback, nothing is deployed)
# - push to main: two builds + publish each to a dedicated branch for Plesk:
#     * 'deploy'      -> base '/', deployed to beta.itcare.com.mx (subdomain)
#     * 'deploy-beta' -> base '/beta/', deployed to itcare.com.mx/beta
#                        (preview folder on the MAIN site; no DNS changes needed)
#
# No server secrets are needed: publishing uses the built-in GITHUB_TOKEN.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (root base)
        run: npm run build

      - name: Upload artifact (root)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          # v4 skips dotfiles by default, which would drop public/.htaccess
          include-hidden-files: true

      - name: Build (beta subfolder base)
        run: npm run build -- --base=/beta/ --outDir dist-beta --emptyOutDir

      - name: Point web.config rewrite at /beta/index.html
        run: sed -i 's|url="/index.html"|url="/beta/index.html"|' dist-beta/web.config

      - name: Upload artifact (beta folder)
        uses: actions/upload-artifact@v4
        with:
          name: dist-beta
          path: dist-beta
          retention-days: 7
          include-hidden-files: true

  deploy:
    name: Publish built sites to deploy branches
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download root build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # NOTE: Vite copies public/ (including .htaccess/web.config) into the
      # build output, so the artifacts already contain them.

      - name: Push dist/ to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"

      - name: Download beta-folder build
        uses: actions/download-artifact@v4
        with:
          name: dist-beta
          path: dist-beta

      - name: Push dist-beta/ to the deploy-beta branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy-beta
          publish_dir: ./dist-beta
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }} (beta folder build)"